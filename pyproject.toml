[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trac-mcp-server"
version = "3.0.0"
description = "Standalone MCP Server for Trac integration"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["trac", "mcp", "model-context-protocol", "project-management", "xml-rpc"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Operating System :: OS Independent",
]
authors = [
  { name = "nerpa.tech" },
]
requires-python = ">=3.10"
dependencies = [
    "requests",
    "python-dotenv",
    # 3.2 to 3.4 are supported, and the suite is exercised on 3.2 and 3.4:
    # mistune 3.4 resolves links at the closing bracket, and the converter's
    # bracket-escape rules split on that (`_DEFERRED_LINK_CLOSE`, Trac #263).
    # The 3.4 path uses mistune internals (`state.brackets`, `Bracket`, the
    # opener token's shape), so a new minor version needs a deliberate bump
    # of this bound and a test run.
    "mistune>=3.2.0,<3.5",
    "mcp[cli]>=1.26.0,<2.0.0",
    "PyYAML>=6.0",
    "lxml>=5.0.0",
    "merge3>=0.0.15",
    "pydantic>=2.0.0",
    "charset-normalizer>=3.0.0",
    "pyperclip>=1.8.2",
    "starlette>=0.40.0",
    "uvicorn>=0.30.0",
    "sse-starlette>=1.6.1",
    "markdownify>=1.2",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-ruff>=0.5.0",
    "pyinstaller>=6.0.0",
    # The HTML -> Markdown self-check renders the emitted Markdown (#209).
    "markdown-it-py>=3.0",
    # Exact: CI installs the newest release that matches, and two ruff
    # versions can format the same line differently (Trac #184).
    "ruff==0.17.4",
    # Pinned exactly, like ruff, for the reason in Trac #184: a newer pyright
    # adds checks and turns a green gate red. The wheel bundles the JS and
    # nodejs-wheel-binaries supplies node, so it runs offline once installed.
    "pyright[nodejs]==1.1.408",
]

[project.scripts]
trac-mcp-server = "trac_mcp_server.mcp.server:run"
trac-convert = "trac_mcp_server.cli.convert:run"
trac-mcp = "trac_mcp_server.cli.client:run"

[project.urls]
Homepage = "https://github.com/nerpa-tech/trac-mcp-server"
Repository = "https://github.com/nerpa-tech/trac-mcp-server"
Issues = "https://github.com/nerpa-tech/trac-mcp-server/issues"
Changelog = "https://github.com/nerpa-tech/trac-mcp-server/blob/master/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--ruff --ruff-format"

[tool.ruff]
line-length = 72
target-version = "py310"

[tool.ruff.lint]
select = [
    "E4", "E7", "E9",  # pycodestyle errors (subset)
    "F",                 # pyflakes
    "B",                 # flake8-bugbear
    "I",                 # isort
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
# The golden Markdown files are the converter's exact output, Python code
# blocks included; ruff would reformat those blocks (Trac #209).
exclude = ["tests/fixtures/trac_html/*.golden.md"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]  # Allow assert True/False in tests
# B904 asks for `raise ... from err` / `from None` inside except. Either
# changes the raised exception's __cause__/__suppress_context__, which is a
# behaviour change in a plugin this ticket (#279) only lints, so these two
# raises stay as they are until the plugin is changed on purpose.
"plugins/tracrpc_comment/tracrpc_comment/ticket_comment.py" = ["B904"]
"plugins/tracrpc_comment/tracrpc_comment/wiki_put.py" = ["B904"]
