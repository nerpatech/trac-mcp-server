LogFormat "%u \"%r\" %>s" who
CustomLog ${APACHE_LOG_DIR}/access.log who

WSGIDaemonProcess trac python-home=/opt/trac user=www-data group=www-data
WSGIProcessGroup trac
WSGIApplicationGroup %{GLOBAL}

# Validates the Keycloak access token and maps it to a Trac username.
OIDCOAuthVerifyJwksUri     https://keycloak:8443/realms/trac-demo/protocol/openid-connect/certs
OIDCOAuthRemoteUserClaim   preferred_username
# Keycloak's certificate is self-signed in this setup. Leave this out in production.
OIDCOAuthSSLValidateServer Off

<VirtualHost *:80>
    # The endpoint for OIDC per-user auth: TRAC_MCP_OIDC_RPC_URL points at
    # /trac-api/login/xmlrpc. /login/ makes Trac use REMOTE_USER.
    WSGIScriptAlias /trac-api /opt/trac/trac.wsgi
    <Location "/trac-api">
        AuthType oauth20
        AuthName "trac-api"
        Require claim aud:trac-mcp-api
    </Location>

    # The ordinary entry point with a shared account, for TRAC_URL and for
    # the startup self-test when TRAC_USERNAME/TRAC_PASSWORD are set as well.
    WSGIScriptAlias /trac /opt/trac/trac.wsgi
    <Location "/trac">
        AuthType Basic
        AuthName "trac"
        AuthUserFile /var/trac/htpasswd
        Require valid-user
    </Location>
</VirtualHost>
