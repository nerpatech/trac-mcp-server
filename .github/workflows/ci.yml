# One declared environment (Trac #184, #262): every job installs against
# constraints/deploy.txt on the Python in .python-version, prints what it
# got, and runs scripts/check_env.py, which fails on any drift from those
# two files. ci.sh does the same locally, so a local pass is a GitHub
# pass. A runner image is pinned (ubuntu-24.04) so the OS does not move
# either; newer upstream releases are watched by upstream.yml instead.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: "pip"
      - run: pip install -e ".[dev]" -c constraints/deploy.txt
      - name: Installed versions
        run: pip freeze
      - run: python scripts/check_env.py
      - run: ruff check src/ tests/ scripts/
      - run: ruff format --check src/ tests/ scripts/

  typecheck:
    runs-on: ubuntu-24.04
    env:
      PYRIGHT_PYTHON_IGNORE_WARNINGS: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: "pip"
      - run: pip install -e ".[dev]" -c constraints/deploy.txt
      - name: Installed versions
        run: pip freeze
      - run: python scripts/check_env.py
      - run: pyright --pythonpath "$(command -v python)" src/

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: "pip"
      - run: pip install -e ".[dev]" -c constraints/deploy.txt
      - name: Installed versions
        run: pip freeze
      - run: python scripts/check_env.py
      - run: pytest tests/

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: "pip"
      - run: pip install -e ".[dev]" -c constraints/deploy.txt
      - name: Installed versions
        run: pip freeze
      - run: python scripts/check_env.py
      - run: bash build.sh
