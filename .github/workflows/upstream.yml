# Reports upcoming dependency breakage weekly without touching master's
# CI: the suite runs against the NEWEST releases the pyproject ranges
# allow, with no constraints file, on the declared Python. A red run here
# means a pin bump needs work first (Trac #262). It runs no check_env.py:
# being unconstrained is the point.
name: Upstream (unconstrained)

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  upstream:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: "pip"
      - run: pip install -e ".[dev]"
      - name: Installed versions
        run: pip freeze
      - run: pytest tests/
